[package]
name = "gossipd-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gossipd-core = { path = ".." }

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auth_frame"
path = "fuzz_targets/auth_frame.rs"
test = false
doc = false
bench = false

# Own workspace so the fuzz crate (needs nightly + libfuzzer) is excluded from
# the normal `cargo build`.
[workspace]
